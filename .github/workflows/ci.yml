name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system tools used by the sandboxed shell
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 curl git
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q --timeout=300
      - name: Offline demo episode (scripted reference solver)
        run: sregym run --seed 42 --agent scripted --quiet --history-minutes 60 --no-traffic
