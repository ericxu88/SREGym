[project]
name = "sregym-env"
version = "0.1.1"
description = "SREGym — procedurally generated, deterministically verified on-call incident response (verifiers v1 taskset)."
requires-python = ">=3.11,<3.14"
# self-contained: the wheel bundles the sregym core (and its templates), so it installs
# from the Hub's package index without git access; these are sregym's runtime deps.
dependencies = [
    "verifiers>=0.3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faker>=24.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sregym_env"]

[tool.hatch.build.targets.wheel.force-include]
"../../sregym" = "sregym"
