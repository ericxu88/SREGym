[project]
name = "sregym-env"
version = "0.1.4"
description = "SREGym — procedurally generated, deterministically verified on-call incident response (verifiers v1 taskset)."
tags = ["sre", "incident-response", "tool-use", "multi-turn", "agent", "train", "eval"]
requires-python = ">=3.11,<3.14"
# self-contained: scripts/push.sh vendors the sregym core (and its templates) into this
# directory before pushing, so both the wheel and the pulled source tree install without
# needing the parent repo; these are sregym's runtime deps.
dependencies = [
    "verifiers>=0.3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faker>=24.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sregym_env", "sregym"]
