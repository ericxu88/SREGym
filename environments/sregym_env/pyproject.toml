[project]
name = "sregym-env"
version = "0.1.0"
description = "SREGym — procedurally generated, deterministically verified on-call incident response (verifiers v1 taskset)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.0",
    "sregym @ git+https://github.com/ericxu88/SREGym.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["sregym_env"]
