[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sregym"
version = "0.1.0"
description = "SREGym: procedurally-generated incident-response RL environment for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faker>=24.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
sregym = "sregym.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sregym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-ra"
