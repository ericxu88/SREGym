# /etc/nginx/sites-enabled/checkout-service.conf
upstream checkout_service {
    server 127.0.0.1:__SREGYM_PORT__ max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name checkout.__SREGYM_DOMAIN__ api.__SREGYM_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__SREGYM_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SREGYM_DOMAIN__/privkey.pem;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 1m;

    location /health {
        proxy_pass http://checkout_service;
        access_log off;
    }

    location /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://checkout_service;
    }

    location / {
        proxy_pass http://checkout_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
    }
}
